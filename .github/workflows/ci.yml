name: CI Pipeline

'on':
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  install-and-build:
    name: Install and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1