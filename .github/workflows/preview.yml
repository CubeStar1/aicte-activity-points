name: Preview Deployment

'on':
  pull_request:
    branches: [ main ]

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js build
        run: npm run build

      - name: Deploy to Preview Environment
        run: echo "Deploy to preview environment (e.g., Vercel/Netlify)"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Replace with actual deployment command, e.g., `npx vercel --prod` or similar
